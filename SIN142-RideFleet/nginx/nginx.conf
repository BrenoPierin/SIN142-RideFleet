events {
    worker_connections 1024;
}

http {
    # Pool de instancias — round-robin por padrao
    upstream ridefleet_backend {
        server ridefleet-grupo-a-1:8000;
        server ridefleet-grupo-a-2:8000;
    }

    server {
        listen 80;

        location / {
            # CORS é tratado inteiramente pelo FastAPI (CORSMiddleware).
            # O Nginx apenas repassa — inclusive o preflight OPTIONS, que
            # o CORSMiddleware responde sozinho. Nada de add_header aqui,
            # senao os headers chegam duplicados ("*, *") e o navegador recusa.

            proxy_pass         http://ridefleet_backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # Health check do proprio Nginx
        location /nginx-health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}