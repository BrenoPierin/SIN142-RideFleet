# ─────────────────────────────────────────────────────────────────────────────
# Scrape do RideFleet (grupo A) para o Prometheus do Core.
#
# Cole este job no prometheus.yml do Core (ou peça para a equipe do Core
# adicionar). O Prometheus precisa estar na rede docker `ridefleet-net` para
# resolver os nomes dos containers.
#
# IMPORTANTE: aponte para CADA instância diretamente — NÃO para o nginx (porta
# 8000 do host). Se você raspar via load balancer, o round-robin embaralha as
# amostras entre as duas instâncias e o gráfico fica inconsistente. Raspando
# cada container, o Grafana mostra a distribuição de carga entre instâncias
# (cada série traz o label `service_instance`).
# ─────────────────────────────────────────────────────────────────────────────

scrape_configs:
  - job_name: ridefleet-grupo-a
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - ridefleet-grupo-a-1:8000
          - ridefleet-grupo-a-2:8000
        labels:
          group: ridefleet-grupo-a

# ─────────────────────────────────────────────────────────────────────────────
# Consultas (PromQL) úteis para montar / conferir os painéis no Grafana do Core:
#
#   Throughput (req/s) por instância:
#     sum by (service_instance) (rate(ridefleet_http_requests_total[1m]))
#
#   Latência p95 dos endpoints de corrida:
#     histogram_quantile(0.95, sum by (le, endpoint)
#       (rate(ridefleet_ride_request_latency_seconds_bucket[5m])))
#
#   Locais vs. delegadas para fora:
#     sum(rate(ridefleet_rides_local_total[5m]))
#     sum(rate(ridefleet_rides_delegated_out_total[5m]))
#
#   Recebidas por delegação (por grupo de origem):
#     sum by (origin_service) (rate(ridefleet_rides_received_delegation_total[5m]))
#
#   Estado do serviço (0=disponivel, 1=congestionado, 2=fora_do_ar):
#     ridefleet_service_state
#
#   Tamanho das filas:
#     ridefleet_queue_size
#
#   Distribuição de carga entre instâncias (via LB):
#     sum by (service_instance) (rate(ridefleet_http_requests_total[1m]))
# ─────────────────────────────────────────────────────────────────────────────
