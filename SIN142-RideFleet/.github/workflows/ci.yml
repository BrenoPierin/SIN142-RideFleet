name: CI/CD

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  # ── BUILD ──────────────────────────────────────────────────────────────────
  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (valida o Dockerfile; sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ridefleet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── TESTES UNITÁRIOS ─────────────────────────────────────────────────────────
  unit-tests:
    name: Testes unitarios
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      SERVICE_NAME: ridefleet-grupo-a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pytest (maquina de estados)
        run: pytest tests/test_ride_state_machine.py -v

  # ── TESTES DE INTEGRAÇÃO ─────────────────────────────────────────────────────
  integration-tests:
    name: Testes de integracao
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      REDIS_URL: redis://localhost:6379
      SERVICE_NAME: ridefleet-grupo-a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pytest (integracao - Semana 3)
        run: pytest tests/test_semana3.py -v

  # ── TESTES DE CONTRATO DO CORE ───────────────────────────────────────────────
  contract-tests:
    name: Testes de contrato do Core
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      SERVICE_NAME: ridefleet-grupo-a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: pytest (contrato + metricas)
        run: pytest tests/test_core_contract.py -v

  # ── PUBLICAÇÃO DA IMAGEM (só na main) ────────────────────────────────────────
  publish:
    name: Publicar imagem no GHCR
    needs: [ build, unit-tests, integration-tests, contract-tests ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nome da imagem em minusculo (GHCR exige lowercase)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── DEPLOY AUTOMÁTICO (só na main, após publicar) ────────────────────────────
  deploy:
    name: Deploy automatico
    needs: [ publish ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (pull + up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d
            docker image prune -f
