services:

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ridefleet-1
      - ridefleet-2
    networks:
      - ridefleet-net
    restart: unless-stopped

  ridefleet-1:
    build: .
    container_name: ridefleet-grupo-a-1
    environment:
      - DATABASE_URL=postgresql+asyncpg://ridefleet:ridefleet123@db:5432/ridefleet
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=ridefleet-grupo-a
      - INSTANCE_ID=ridefleet-grupo-a-1
      - SERVICE_VERSION=0.4.0
      # O Core alcança o Nginx do RideFleet via host.docker.internal:8000
      - SERVICE_URL=${SERVICE_URL}
      - CORE_URL=${CORE_URL}
      - CORE_API_KEY=${CORE_API_KEY:-}
      - MIN_ETA_SECONDS=120
      - BASE_PRICE=12.0
      - MIN_AVAILABLE_DRIVERS=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ridefleet-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health',timeout=3).status_code==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  ridefleet-2:
    build: .
    container_name: ridefleet-grupo-a-2
    environment:
      - DATABASE_URL=postgresql+asyncpg://ridefleet:ridefleet123@db:5432/ridefleet
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=ridefleet-grupo-a
      - INSTANCE_ID=ridefleet-grupo-a-2
      - SERVICE_VERSION=0.4.0
      - SERVICE_URL=${SERVICE_URL}
      - CORE_URL=${CORE_URL}
      - CORE_API_KEY=${CORE_API_KEY:-}
      - MIN_ETA_SECONDS=120
      - BASE_PRICE=12.0
      - MIN_AVAILABLE_DRIVERS=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ridefleet-net
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx,sys; sys.exit(0 if httpx.get('http://localhost:8000/health',timeout=3).status_code==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ridefleet
      POSTGRES_PASSWORD: ridefleet123
      POSTGRES_DB: ridefleet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridefleet"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ridefleet-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ridefleet-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ridefleet-a-prometheus
    ports:
      - "9091:9090"          # host 9091 (o Core já usa 9090)
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - ridefleet-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ridefleet-a-grafana
    ports:
      - "3001:3000"          # host 3001 (o Core já usa 3000)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ridefleet-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  ridefleet-net:
    external: true   # Rede criada pelo Core — não recrie aqui
    name: ridefleet-net
