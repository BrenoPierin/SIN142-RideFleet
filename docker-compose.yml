services:

  # --- Load Balancer ---
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ridefleet-1:
        condition: service_healthy
      ridefleet-2:
        condition: service_healthy
    restart: unless-stopped

  # --- Instância 1 do serviço ---
  ridefleet-1:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://ridefleet:ridefleet123@db:5432/ridefleet
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=ridefleet-1
      - ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # --- Instância 2 do serviço ---
  ridefleet-2:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://ridefleet:ridefleet123@db:5432/ridefleet
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=ridefleet-2
      - ENV=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ridefleet
      POSTGRES_PASSWORD: ridefleet123
      POSTGRES_DB: ridefleet
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridefleet"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Redis (fila de corridas) ---
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes   # persistência AOF
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
